services:
  mysql:
    image: mysql:8.0
    container_name: smartexpense-mysql
    restart: unless-stopped
    command: mysqld --innodb-buffer-pool-size=64M --innodb-log-buffer-size=8M --max-connections=30 --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${DB_NAME:-personal_finance_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-123456$}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/database:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - smartexpense-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartexpense-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-personal_finance_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-personal_finance_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-j6uECsjbXr08La2gKzpRPUzOmGSUyCS7/kXGeTVxjfs=}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      JAVA_OPTS: "-Xms128m -Xmx320m -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 450M
    networks:
      - smartexpense-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: smartexpense-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - smartexpense-net

networks:
  smartexpense-net:
    name: smartexpense-net
    driver: bridge

volumes:
  mysql_data:
    name: smartexpense_mysql_data
    driver: local
