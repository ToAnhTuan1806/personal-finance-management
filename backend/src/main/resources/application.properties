spring.application.name=backend

# Không ghi log DEBUG của bộ xử lý ngoại lệ vì có thể chứa mật khẩu bị validation từ chối.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_finance_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - Secret lấy từ biến môi trường
