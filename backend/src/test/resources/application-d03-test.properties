# Chỉ lớp integration test cấp URL, tài khoản và khóa JWT động; không có fallback ứng dụng.
spring.datasource.url=jdbc:disabled:d03-test-requires-container
spring.datasource.username=d03_unconfigured
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.jwt.secret=REQUIRES_DYNAMIC_TEST_KEY
app.jwt.expiration=600

# Chỉ tạo bảng mới trong schema tạm; rollback từng test và xóa container để dọn dữ liệu.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
logging.level.root=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=WARN
