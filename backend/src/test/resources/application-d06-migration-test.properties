# Chỉ test cấp DataSource/khóa động; không nạp cấu hình ứng dụng hoặc credential production.
spring.datasource.url=jdbc:disabled:d06-migration-requires-container
spring.datasource.username=d06_unconfigured
spring.datasource.password=
app.jwt.secret=REQUIRES_DYNAMIC_TEST_KEY
app.jwt.expiration=600

# Validate thật sau khi SQL V002 đã chạy; không bật schema-generation create/update.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
logging.level.root=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.springframework.web=INFO
