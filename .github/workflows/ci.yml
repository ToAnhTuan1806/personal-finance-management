name: SmartExpense CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Quality & Build Verification
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test

      - name: Build Production Frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  # ----------------------------------------------------------------------------
  # Job 2: Backend Quality & Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Require Docker for MySQL integration tests
        run: docker info > /dev/null

      - name: Run Backend Tests
        # Xóa kết quả cũ và tắt build cache để bằng chứng thuộc lần chạy CI hiện tại.
        run: ./gradlew cleanTest test --no-build-cache --console=plain

      - name: Verify D03 MySQL JUnit report (55 PASS, 0 skipped)
        if: ${{ !cancelled() }}
        run: ./gradlew verifyD03IntegrationTests --console=plain

      - name: Build Spring Boot Executable JAR
        run: ./gradlew bootJar -x test

  # ----------------------------------------------------------------------------
  # Job 3: Docker & Compose Packaging Verification
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Packaging Check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          DB_NAME: smartexpense_ci
          DB_USERNAME: root
          FRONTEND_PORT: 8088
        shell: bash
        run: |
          ci_password="$(openssl rand -hex 32)"
          ci_jwt_secret="$(openssl rand -base64 32)"
          printf '::add-mask::%s\n' "$ci_password"
          printf '::add-mask::%s\n' "$ci_jwt_secret"
          export DB_PASSWORD="$ci_password" DB_ROOT_PASSWORD="$ci_password" JWT_SECRET="$ci_jwt_secret"
          docker compose --env-file /dev/null config --quiet

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smartexpense-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: false
          tags: smartexpense-frontend:ci
