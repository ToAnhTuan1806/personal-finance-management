name: SmartExpense CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Frontend Quality & Build Verification
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Tests
        run: npm test

      - name: Build Production Frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  # ----------------------------------------------------------------------------
  # Job 2: Backend Quality & Unit/Integration Tests
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: personal_finance_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -pci_test_password" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Backend Tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/personal_finance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ci_test_password
          JWT_SECRET: j6uECsjbXr08La2gKzpRPUzOmGSUyCS7/kXGeTVxjfs=
        run: ./gradlew test

      - name: Build Spring Boot Executable JAR
        run: ./gradlew bootJar -x test

  # ----------------------------------------------------------------------------
  # Job 3: Docker & Compose Packaging Verification
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Packaging Check
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          DB_NAME: personal_finance_db
          DB_USERNAME: root
          DB_PASSWORD: test_password_123
          DB_ROOT_PASSWORD: test_password_123
          JWT_SECRET: j6uECsjbXr08La2gKzpRPUzOmGSUyCS7/kXGeTVxjfs=
          FRONTEND_PORT: 8088
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smartexpense-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: false
          tags: smartexpense-frontend:ci
