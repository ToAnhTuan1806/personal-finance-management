name: SmartExpense CD Pipeline - Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Triển khai lên VPS sau khi build image?'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build Docker images and push to GitHub Container Registry (GHCR)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/backend:latest
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/frontend:latest
            ${{ steps.repo_name.outputs.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 2: Remote Deploy to VPS over SSH
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' || inputs.deploy_to_vps == true
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ''
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo ">>> Đang cập nhật SmartExpense trên VPS..."
            cd /opt/smartexpense
            
            # Kéo mã nguồn mới nhất (đồng bộ sạch với remote, tránh xung đột working tree)
            git fetch origin
            CURRENT_BRANCH=$(git branch --show-current)
            git reset --hard "origin/$CURRENT_BRANCH"
            
            # Cấu hình sử dụng image từ GHCR
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            grep -q '^BACKEND_IMAGE=' .env && sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/backend:latest|" .env || echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/backend:latest" >> .env
            grep -q '^FRONTEND_IMAGE=' .env && sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}/frontend:latest|" .env || echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}/frontend:latest" >> .env
            
            # Đăng nhập GHCR nếu cần kéo image private
            if [ -n "${{ secrets.CR_PAT }}" ]; then
              echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            fi
            
            echo ">>> Tải images mới nhất từ GHCR..."
            docker compose pull backend frontend || true
            
            echo ">>> Khởi động lại containers với hình ảnh mới nhất..."
            docker compose up -d --no-deps --force-recreate frontend backend
            
            echo ">>> Chờ 5 giây để các dịch vụ ổn định..."
            sleep 5
            
            echo ">>> Trạng thái hệ thống sau cập nhật:"
            docker compose ps
            
            echo ">>> Kiểm tra tài nguyên tĩnh trong frontend container:"
            docker exec smartexpense-frontend ls -la /usr/share/nginx/html || true
            
            echo ">>> Kiểm tra phản hồi HTTP nội bộ cổng 8088:"
            curl -sI http://127.0.0.1:8088/ || true
            
            # Mở khóa toàn bộ IP bị chặn trong fail2ban (nếu có)
            if command -v fail2ban-client >/dev/null 2>&1; then
              fail2ban-client unban 183.80.156.241 || true
            fi
            
            echo ">>> Dọn dẹp images cũ tiết kiệm ổ đĩa..."
            docker image prune -f || true
            
            echo ">>> Triển khai thành công!"
